<script>
const $=id=>document.getElementById(id);
let songs=[],editing=null,offset=0,audioURL=null;
let scrollInterval=null,isScrolling=false;
const keys=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B','Cm','C#m','Dm','D#m','Em','Fm','F#m','Gm','G#m','Am','A#m','Bm'];
keys.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;$('key').appendChild(o)});
try{songs=JSON.parse(localStorage.getItem('clp_songs')||'[]');if(!Array.isArray(songs))songs=[]}catch(e){songs=[]}
function persist(){try{localStorage.setItem('clp_songs',JSON.stringify(songs));return true}catch(e){return false}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function base(k){return k.endsWith('m')?k.slice(0,-1):k}
function idx(k){let b=base(k);const flats={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};return keys.slice(0,12).indexOf(flats[b]||b)}
function transposeChord(ch,n){let m=ch.match(/^([A-G](?:#|b)?)(.*)$/);if(!m)return ch;let i=idx(m[1]);if(i<0)return ch;return keys.slice(0,12)[(i+n+120)%12]+m[2]}
function transposeText(text,n){return text.split('\n').map(line=>line.replace(/(^|[\s|(\[])([A-G](?:#|b)?(?:m|maj7|maj|min|sus[24]?|dim|aug|add9|7M|M7|7|9|11|13)?(?:\/[A-G](?:#|b)?)?)(?=$|[\s|)\]])/g,(all,pre,ch)=>{let p=ch.split('/');return pre+transposeChord(p[0],n)+(p[1]?'/'+transposeChord(p[1],n):'')})).join('\n')}
function formatted(text){return safe(text).replace(/\b([A-G](?:#|b)?(?:m|maj7|maj|min|sus[24]?|dim|aug|add9|7M|M7|7|9|11|13)?(?:\/[A-G](?:#|b)?)?)\b/g,'<span class="chord">$1</span>')}
function tabs(id){
if(isScrolling&&id!=='stage')pararRolagem();
document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));
document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
if(id==='library')renderSongs();if(id==='stage')renderStageSelect()
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tabs(b.dataset.tab));
function renderSongs(){let q=$('search').value.toLowerCase(),box=$('songs');box.innerHTML='';let arr=songs.filter(s=>(s.title+' '+(s.artist||'')).toLowerCase().includes(q));if(!arr.length){box.innerHTML='<div class="card muted">Nenhuma música cadastrada. Toque em “Nova música” para começar.</div>';return}arr.forEach(s=>{let b=document.createElement('button');b.className='song';b.innerHTML='<span class="pill">'+safe(s.key)+'</span><strong>'+safe(s.title)+'</strong><small>'+safe(s.artist||'Artista não informado')+'</small><div class="muted" style="margin-top:7px">Toque para editar</div>';b.onclick=()=>{load(s.id);tabs('editor')};box.appendChild(b)})}
$('search').oninput=renderSongs;
function load(id){let s=songs.find(x=>x.id===id);if(!s)return;editing=id;$('title').value=s.title;$('artist').value=s.artist||'';$('key').value=s.key;$('lyrics').value=s.lyrics;$('msg').textContent='Editando música salva.';preview()}
function clearEditor(){editing=null;$('title').value='';$('artist').value='';$('key').value='C';$('lyrics').value='';$('msg').textContent='';preview()}
$('clear').onclick=clearEditor;
$('save').onclick=()=>{let title=$('title').value.trim();if(!title){$('msg').textContent='Digite o nome da música.';$('title').focus();return}let s={id:editing||Date.now().toString(),title,artist:$('artist').value.trim(),key:$('key').value,lyrics:$('lyrics').value};if(editing)songs=songs.map(x=>x.id===editing?s:x);else songs.unshift(s);editing=s.id;let ok=persist();$('msg').textContent=ok?'Música salva neste aparelho.':'Não foi possível salvar. Exporte o backup e libere espaço no aparelho.';renderSongs();renderStageSelect()};
function preview(){$('editorPreview').innerHTML=formatted($('lyrics').value)||'As cifras aparecerão aqui.'}
$('lyrics').oninput=preview;$('key').onchange=preview;
function renderStageSelect(){let sel=$('stageSong'),old=sel.value;sel.innerHTML='';songs.forEach(s=>{let o=document.createElement('option');o.value=s.id;o.textContent=s.title;sel.appendChild(o)});if(songs.some(s=>s.id===old))sel.value=old;offset=0;stage()}
function stage(){let s=songs.find(x=>x.id===$('stageSong').value);if(!s){$('stageLyrics').textContent='Cadastre uma música para começar.';$('currentKey').textContent='—';return}let i=idx(s.key);$('currentKey').textContent=i<0?s.key:keys.slice(0,12)[(i+offset+120)%12]+(s.key.endsWith('m')?'m':'');$('stageLyrics').innerHTML=formatted(transposeText(s.lyrics,offset))||'Sem letra cadastrada.'}
$('stageSong').onchange=()=>{offset=0;stage()};$('up').onclick=()=>{offset++;stage()};$('down').onclick=()=>{offset--;stage()};$('reset').onclick=()=>{offset=0;stage()};$('font').oninput=e=>$('stageLyrics').style.fontSize=e.target.value+'px';
$('audioFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(f);$('player').src=audioURL;$('player').classList.remove('hidden');$('audioName').textContent=f.name+' • '+(f.size/1048576).toFixed(1)+' MB'};
$('audioEditor').onclick=()=>tabs('editor');
$('export').onclick=()=>{let blob=new Blob([JSON.stringify(songs,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cifra-louvor-pro-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(s=>s.title&&s.key&&typeof s.lyrics==='string'))throw Error();songs=data.map((s,i)=>({...s,id:String(s.id||Date.now()+i)}));persist();renderSongs();renderStageSelect();alert('Backup importado.')}catch(err){alert('Arquivo inválido. Use um backup exportado pelo Cifra Louvor Pro.')}e.target.value=''};

$('toggle-dark').onclick=()=>{
document.body.classList.toggle('dark-mode');
let isDark = document.body.classList.contains('dark-mode');
$('toggle-dark').textContent = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
$('meta-theme').setAttribute('content', isDark ? '#0b2621' : '#123c35');
};

function pararRolagem(){clearInterval(scrollInterval);isScrolling=false;$('toggle-scroll').textContent='▶️ Rolagem'}
$('toggle-scroll').onclick=()=>{
if(isScrolling){pararRolagem()}else{isScrolling=true;$('toggle-scroll').textContent='⏸️ Parar';
scrollInterval=setInterval(()=>{window.scrollBy(0,1);if((window.innerHeight+window.scrollY)>=document.body.offsetHeight){pararRolagem()}},40)}
};

if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
renderSongs();renderStageSelect();preview();
</script>
