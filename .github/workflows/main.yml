name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04  # Usa um ambiente Linux mais estável para ferramentas antigas

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Compilar aplicativo com Gradle Nativo
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle assembleDebug --no-daemon
