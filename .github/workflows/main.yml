name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar o Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Dar permissao de execucao para o Gradle
      run: |
        GRADLEW_PATH=$(find . -name gradlew)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Erro: Arquivo gradlew nao foi encontrado no repositorio!"
          exit 1
        fi
        chmod +x "$GRADLEW_PATH"
        echo "SUBPASTA_CONTEUDO=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

    - name: Build APK
      run: |
        cd ${{ env.SUBPASTA_CONTEUDO }}
        ./gradlew assembleDebug

    - name: Upload do APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
