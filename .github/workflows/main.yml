    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar e Atualizar o Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Buildar APK
        run: ./gradlew assembleDebug
