name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Configurar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Compilar Projeto em Diretório Isolado
        run: |
          mkdir -p /tmp/gradle-build
          gradle build --project-cache-dir=/tmp/gradle-build --no-daemon

      - name: Disponibilizar Arquivos Prontos
        uses: actions/upload-artifact@v4
        with:
          name: Cifra Louvor Pro Compilado
          path: |
            **/build/libs/*
            **/build/outputs/*
            **/dist/*
