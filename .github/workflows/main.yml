name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js (Ambiente Web)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Java JDK 11 (Requisito do Android)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Instalar Empacotador do Google (Bubblewrap)
        run: npm install -g @bubblewrap/cli

      - name: Gerar Projeto Android e Compilar APK
        run: |
          # Inicializa o empacotador usando o seu arquivo manifest.json existente
          bubblewrap init --manifest=manifest.json --no-interactive || true
          
          # Gera e compila os arquivos do instalador Android
          bubblewrap build --no-interactive || true

      - name: Disponibilizar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Cifra Louvor Pro APK
          path: |
            **/*.apk
            ./*.apk
