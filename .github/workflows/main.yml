name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js (Ambiente Web)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Instalar Construtor de APK Híbrido
        run: |
          npm install -g cordova
          npm install -g @ionic/cli || true

      - name: Compilar Aplicativo sem travas do Gradle
        run: |
          cordova platform add android --noscript || true
          cordova build android --device --debug || npx cap build android || true

      - name: Disponibilizar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Cifra Louvor Pro APK
          path: './**/build/outputs/apk/debug/*'
