name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Instalar Gradle Versão Compatível
        uses: editrick/setup-gradle@v1
        with:
          gradle-version: '7.5'

      - name: Compilar aplicativo
        run: gradle assembleDebug --no-daemon
