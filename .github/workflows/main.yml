name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Dar permissão de execução para o Gradle
      run: chmod +x gradlew

    - name: Buildar com o Gradle
      run: ./gradlew build

    # --- ETAPAS DE GERAÇÃO DO APK ---
    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name:meu-aplicativo-apk
        path: app/build/outputs/apk/debug/app-debug.apk
