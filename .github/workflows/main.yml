name: Gerar APK com Capacitor

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias
        run: npm install

      - name: Limpar Pastas Antigas e Configurar Capacitor
        run: |
          rm -rf android
          rm -f build.gradle settings.gradle gradle.properties
          npx cap init "Cifra Louvor Pro" "com.brunosantos.cifralouvor" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-cifra-louvor
          path: android/app/build/outputs/apk/debug/app-debug.apk
