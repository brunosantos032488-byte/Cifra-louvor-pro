name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar o Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Instalar o Gradle no Servidor
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Localizar o arquivo build.gradle e Buildar APK
      run: |
        BUILD_PATH=$(find . -name build.gradle -o -name build.gradle.kts | head -n 1)
        if [ -z "$BUILD_PATH" ]; then
          echo "Erro: Nenhum arquivo build.gradle encontrado no projeto!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$BUILD_PATH")
        cd "$PROJECT_DIR"
        gradle assembleDebug

    - name: Upload do APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
