name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Configurar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Compilar APK em Diretório Isolado
        run: |
          # Força o Gradle a usar uma pasta temporária com permissão total de escrita
          mkdir -p /tmp/gradle-build
          gradle assembleDebug --project-cache-dir=/tmp/gradle-build --no-daemon

      - name: Disponibilizar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Cifra Louvor Pro APK
          path: |
            **/*.apk
