name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Instalar Gradle na Máquina Virtual
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar aplicativo
        run: |
          chmod +x build.gradle || true
          gradle assembleDebug --stacktrace
